# Builds the docs in docs/ and publishes them to the GitHub Pages of this
# repository. Runs on a push to main that changes docs/ or the Rust sources.
# The API reference is rendered by plissken (plissken.toml) before the build;
# it is not in git.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "plissken.toml"
      - "crates/*/src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "plissken.toml"
      - "crates/*/src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PLISSKEN_VERSION: 0.2.1
  PLISSKEN_SHA256: bf41f2fbc6f375552e29cf56a78b675cf857a1fa689c9905a5caba109ad292bf

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - name: Install plissken
        working-directory: .
        run: |
          tarball="plissken-${PLISSKEN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/colliery-io/plissken/releases/download/v${PLISSKEN_VERSION}/${tarball}"
          echo "${PLISSKEN_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/plissken"
          tar -xzf "${tarball}" -C "$RUNNER_TEMP/plissken"
          rm "${tarball}"
          echo "$RUNNER_TEMP/plissken" >> "$GITHUB_PATH"
      - name: Render the API reference
        working-directory: .
        run: plissken render
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      # With a committed docs/package-lock.json, the build is the same each
      # time (npm ci). Commit it after the first npm install.
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
